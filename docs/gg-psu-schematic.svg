<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" role="img" aria-labelledby="title desc">
  <title id="title">GZLOZONE GG-PSU - block schematic (values TBD)</title>
  <desc id="desc">Dual HV MOSFET regulators + filament LT1085/LM317. Green = confirmed silk/topology. Yellow = inferred - measure before power.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #f7f4ef; }
      .card { fill: #fffdf8; stroke: #2a2a2a; stroke-width: 1.2; }
      .title { font: 700 22px "Segoe UI", sans-serif; fill: #1a1a1a; }
      .sub { font: 400 12px "Segoe UI", sans-serif; fill: #444; }
      .lbl { font: 600 13px Consolas, monospace; fill: #1a1a1a; }
      .sm { font: 400 11px Consolas, monospace; fill: #333; }
      .note { font: 400 11px "Segoe UI", sans-serif; fill: #555; }
      .wire { fill: none; stroke: #1a1a1a; stroke-width: 1.6; stroke-linecap: round; }
      .conf { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.2; }
      .unk { fill: #fff3cd; stroke: #856404; stroke-width: 1.2; stroke-dasharray: 3 2; }
      .mid { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.2; }
      .gnd { fill: none; stroke: #1a1a1a; stroke-width: 1.6; }
    ]]></style>
  </defs>

  <rect class="bg" width="1100" height="820"/>

  <a href="./gg-psu/README.md"><text class="note" x="36" y="22" fill="#1565c0" text-decoration="underline">GG-PSU docs</text></a>
  <text class="title" x="36" y="48">GZLOZONE / Zero Zone GG-PSU</text>
  <text class="sub" x="36" y="68">User BOM 2026-11-09: R1-R6, 2SK2700, LT1085CT, KBP307 x3, caps - zeners U</text>

  <!-- Transformer box -->
  <rect class="mid" x="40" y="120" width="200" height="140" rx="8"/>
  <text class="lbl" x="58" y="148">External transformer</text>
  <text class="sm" x="58" y="170">2x HV AC (~220 V class) I</text>
  <text class="sm" x="58" y="188">1x LV AC (~12.6 V) I</text>
  <text class="sm" x="58" y="220">Not on GG-PSU PCB</text>

  <!-- HV channel A -->
  <line class="wire" x1="240" y1="160" x2="300" y2="160"/>
  <rect class="conf" x="300" y="95" width="320" height="130" rx="8"/>
  <text class="lbl" x="318" y="118">HV channel A</text>
  <text class="sm" x="318" y="138">HV-IN - BR1 KBP307 - 100uF 400V</text>
  <text class="sm" x="318" y="156">2SK2700 pass - D-V zeners U</text>
  <text class="sm" x="318" y="174">VDC-OUT + rail</text>
  <line class="wire" x1="620" y1="160" x2="700" y2="160"/>
  <text class="lbl" x="705" y="155">+200 V</text>

  <!-- HV channel B -->
  <line class="wire" x1="240" y1="220" x2="300" y2="220"/>
  <rect class="conf" x="300" y="255" width="320" height="130" rx="8"/>
  <text class="lbl" x="318" y="278">HV channel B</text>
  <text class="sm" x="318" y="298">HV-IN - BR2 KBP307 - 100uF 400V</text>
  <text class="sm" x="318" y="316">2SK2700 pass - D-V zeners U</text>
  <text class="sm" x="318" y="334">VDC-OUT (ref -)</text>
  <line class="wire" x1="620" y1="320" x2="700" y2="320"/>
  <text class="lbl" x="705" y="315">-200 V</text>

  <!-- GND tie -->
  <line class="gnd" x1="700" y1="240" x2="760" y2="240"/>
  <line class="gnd" x1="760" y1="240" x2="760" y2="255"/>
  <line class="gnd" x1="748" y1="255" x2="772" y2="255"/>
  <text class="lbl" x="770" y="238">GND</text>
  <text class="note" x="770" y="280">strap A+/B- for bipolar I</text>

  <!-- Filament -->
  <line class="wire" x1="240" y1="280" x2="270" y2="280"/>
  <line class="wire" x1="270" y1="280" x2="270" y2="480"/>
  <line class="wire" x1="270" y1="480" x2="300" y2="480"/>
  <rect class="conf" x="300" y="430" width="320" height="120" rx="8"/>
  <text class="lbl" x="318" y="455">Filament regulator</text>
  <text class="sm" x="318" y="475">BR3 KBP307 - 4700uF 25V x2</text>
  <text class="sm" x="318" y="493">LT1085CT + W202 2k</text>
  <text class="sm" x="318" y="511">C9 100uF/50V, C10 10uF/50V, LED</text>
  <line class="wire" x1="620" y1="490" x2="700" y2="490"/>
  <text class="lbl" x="705" y="495">+12 V</text>

  <!-- GG-PRE connector -->
  <rect class="conf" x="820" y="120" width="250" height="200" rx="8"/>
  <text class="lbl" x="838" y="148">GG-PRE POWER (C)</text>
  <text class="sm" x="838" y="170">1  -200V</text>
  <text class="sm" x="838" y="188">2  +12</text>
  <text class="sm" x="838" y="206">3  +200V</text>
  <text class="sm" x="838" y="224">4  GND</text>
  <line class="wire" x1="760" y1="160" x2="820" y2="200"/>
  <line class="wire" x1="760" y1="320" x2="820" y2="170"/>
  <line class="wire" x1="700" y1="490" x2="820" y2="188"/>
  <line class="wire" x1="760" y1="240" x2="820" y2="224"/>

  <!-- Notes -->
  <rect class="unk" x="40" y="580" width="480" height="200" rx="8"/>
  <text class="lbl" x="58" y="608">Measure later</text>
  <text class="note" x="58" y="632">- Zener D-V ratings, D1/D2 types</text>
  <text class="note" x="58" y="650">- R1 100R LED, R2 10k, R3/R5 220R, R4/R6 47k C</text>
  <text class="note" x="58" y="672">- 4x 10uF/400V channel assignment; HV-IN pin order</text>
  <text class="note" x="58" y="694">- Filament return vs HV GND (hum / bonding)</text>
  <text class="note" x="58" y="712">See gg-psu-component-id.md</text>

  <rect class="card" x="540" y="580" width="530" height="200" rx="8"/>
  <text class="lbl" x="558" y="608">Seller setup hints (I)</text>
  <text class="note" x="558" y="632">Vout_HV = Vz(D-V1) + Vz(D-V2); 200 V: one 200 V zener, other site shorted</text>
  <text class="note" x="558" y="654">Keep >=50-80 V drop across MOSFET under load</text>
  <text class="note" x="558" y="676">HV ~40 mA / LV ~1 A class with default heatsinks (listing)</text>
</svg>
